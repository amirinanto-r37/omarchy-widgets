name: publish

# Builds index.json from the reviewed widgets on main, and apps.json from the apps, and publishes
# the store to GitHub Pages. Apps have a catalog of their own so launchers from before them never
# see one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # owl-apps.jar dates each app by the commit that added it.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Catalog
        run: |
          java -jar tools/owl.jar index .
          java -jar tools/owl-apps.jar index . --apps
      - name: Site
        run: |
          mkdir _site
          cp -r index.json apps.json widgets apps w _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
